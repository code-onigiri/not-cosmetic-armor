buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-1.20.1"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'})"

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Dev runtime uses official names; production Forge uses SRG names.
            // Let Mixin remap refmaps so that production-mapped mod jars run in dev.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Cosmetic Armor Reworked 1.20.1-v1a (CurseForge file 4600191).
    // fg.deobf remaps the SRG release jar into the dev mappings so it can also be
    // loaded in runClient; a raw SRG jar in run/mods crashes the dev runtime.
    implementation fg.deobf('curse.maven:cosmetic-armor-reworked-237307:4600191')

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The mixin annotation processor writes the refmap into build/tmp, which Gradle's
// build cache does not restore. A cache-hit compile therefore yields a jar without
// a refmap, and the mixins fail in production with "No refMap loaded". Keep
// compileJava out of the cache so the processor always runs.
tasks.named('compileJava', JavaCompile).configure {
    outputs.cacheIf { false }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

// The mixin annotation processor writes the refmap into build/tmp and MixinGradle
// copies it into the jar. Without an explicit dependency the copy can run *after*
// the jar on a clean build, shipping a jar whose mixin targets are unmapped.
tasks.named('jar', Jar).configure {
    dependsOn 'addMixinsToJar'
    doLast {
        def hasRefmap = !zipTree(archiveFile.get().asFile)
                .matching { include '**/*.refmap.json' }.isEmpty()
        if (!hasRefmap) {
            throw new GradleException("refmap is missing from ${archiveFile.get().asFile.name}")
        }
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : 'code-onigiri',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'code-onigiri'
        ])
    }
}
