modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"
issueTrackerURL="https://github.com/code-onigiri/not-cosmetic-armor/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Not Cosmetic Armor"
authors="code-onigiri"
credits="Built on Cosmetic Armor Reworked by zlainsama (lain.mods), which owns the cosmetic inventory and the display layer."
logoFile="logo.png"
displayURL="https://github.com/code-onigiri/not-cosmetic-armor"
description='''
Makes Cosmetic Armor Reworked's
cosmetic slots actually work.

Armor attributes, enchantments,
item ticks, durability mirroring
and movement sync (jetpacks fly)
apply from the cosmetic slot.

Requires Cosmetic Armor Reworked
on both client and server.

---

CAR のコスメ装備を、
見た目だけでなく実際に機能させます。

属性・エンチャント・item tick・
耐久ミラー・移動の同期が有効。

クライアントとサーバーの両方に
CAR が必要です。
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="cosmeticarmorreworked"
    mandatory=true
    versionRange="[1.20.1,1.20.2)"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
config="${mod_id}.mixins.json"
